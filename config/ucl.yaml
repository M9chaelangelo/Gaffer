# UEFA Champions League Fantasy — the weekly control surface.
#
# Names are matched against UEFA's feed with accents, full stops and spacing
# folded away, so "B.Fernandes", "B. Fernandes" and "Bruno Fernandes" all
# land on the same row. A name that matches nothing, or matches more than one
# player, is REPORTED rather than guessed at — read the "not matched" line at
# the top of every run and fix the spelling here.

matchday: 3

# Read off the manager's MD2 side. Confirm against the live team before the
# deadline: a squad that is one player wrong produces a transfer plan that is
# wrong in two places.
# Read off the live team on 17 Oct 2026, not reconstructed. The earlier list
# had Maguire, whom the manager does not own, so the plan it produced "bought"
# Bartra — a player already in the squad — and the budget was 9.1m short.
squad:
  - Z. Suzuki        # GK
  - F. Bredlow       # GK
  - Sergi Altimira   # DEF
  - N. Brown         # DEF
  - M. Bartra        # DEF
  - A. Hakimi        # DEF
  - M. Mittelstadt   # DEF
  - R. Zalazar       # MID
  - M. Olise         # MID  — suspended for MD3
  - Bruno Fernandes  # MID
  - L. Yamal         # MID
  - K. Kvaratskhelia # MID
  - H. Kane          # FWD  ("Kane" alone also matches N. Kane of LASK)
  - S. Guirassy      # FWD
  - D. Undav         # FWD

bank: 0.0
free_transfers: 2          # UCL gives two a matchday, and rolls at most one
max_extra_transfers: 0     # each one beyond the free ones costs 4

# Must stay in the squad whatever the solver thinks.
locked: []
# Must not be bought — a player you know is out but whose feed row is clean.
banned: []

# Known out, whatever UEFA's availability prose says. These are projected at
# exactly zero, not at a long shot, so the solver will sell them. The feed
# has never once been ahead of a suspension.
out:
  - Olise            # suspended for MD3
  - Zalazar          # injured

# --- availability ------------------------------------------------------------
# UEFA writes availability as prose and it lags. On 19 Oct 2026 FPL had Haaland
# at "Unspecified injury - 75% chance of playing" at 13:00 and the UEFA feed
# still said "In contention to start next game" four hours later, with the
# matchday deadline the next afternoon — and the engine was captaining him.
#
# Five of the thirty-six clubs in the league phase are Premier League sides, so
# for those the numeric FPL flag is read instead. Set false to use only UEFA's
# prose and whatever is typed below.
use_fpl_flags: true

# P(available), by name, for players no feed has caught up with yet. These win
# over a fetched flag, because someone read the team news to write them. A
# surname is enough; a name that matches nothing is reported, not ignored.
#
#   doubts:
#     Haaland: 0.5      # manager said "we will see"
#     Barkley: 0.0      # left out of the travelling squad
doubts: {}

# Devigged 1X2, home-first, by any substring of the two clubs' names. When a
# fixture is listed here these win; when it is not, the goal rates come from
# the feed's own strength model and the run says "[model]" against that line.
# Measured input — fill it in before the deadline when a book is reachable.
odds: {}
#  Arsenal v Atlético: [0.52, 0.25, 0.23]
