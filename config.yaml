# --- who you are -------------------------------------------------------------
entry_id: 3907632           # your FPL team id
league_id: 88825            # FPL Aarhus Liga

# --- how the gaffer thinks ---------------------------------------------------
horizon: 5                  # gameweeks to plan ahead
decay: 0.87                 # weight on each future gameweek (near-term certainty)
hit_cost: 4                 # points per extra transfer
hit_threshold: 6.0
min_transfer_gain: 1.5    # a transfer must beat this to be recommended; wildcard weeks are exempt
# How hard the learned ceiling tilts the Triple Captain armband toward a player
# who can spike, on top of his expected points. Small on purpose: it breaks ties
# between comparable captains, it does not overrule the projection. Set 0 to
# choose the armband on expected points alone.
# Set to 0 on 10 Oct 2026 because the ceiling model is not calibrated. Its AUC
# is 0.849, which is respectable — but AUC is rank-based and says nothing about
# whether the numbers are probabilities, and this consumer multiplies the
# probability directly. In the GW6 solve B.Fernandes read 0.705 against a median
# of 0.019 and a mean of 0.028, a ~25-sigma outlier, while Haaland — the single
# likeliest hauler in the game — read 0.11, below Dibling and Rice. Several of
# the highest-ceiling players were projected for ~0 points, so it is not
# conditioning on minutes either.
#
# At weight 6.0 that handed B.Fernandes about +4.2 points of armband preference
# from a broken number. Restore it to 6.0 once `ceiling` is wrapped in a
# calibrator (Platt or isotonic) and scores.json records calibration error
# alongside AUC.
ceiling_weight: 0.0
max_chips_in_horizon: 2          # only recommend a hit if it gains this much over the horizon
bench_weights: [0.16, 0.11, 0.06, 0.02]

# --- mini-league strategy ----------------------------------------------------
# 0.0 = pure expected points. 1.0 = pure differential-chasing.
#
# Raised 0.35 -> 0.60 on 16 Oct 2026. The manager's stated goal is the
# mini-league, not overall rank, and he is LAST of 42 with the leader 132
# points clear. Playing the field's own template from behind cannot close a
# gap that size: matching everyone's score keeps the gap exactly where it is.
# Closing it needs players the teams above him do not own, which is what
# this dial buys — at the cost of a wider spread in both directions, which
# is the correct trade when the downside is finishing last either way.
#
# Lower it back toward 0.35 once the gap is inside roughly 40 points, and to
# 0.2 if he leads. See template.py for the arithmetic this feeds.
rivalry: 0.60

# --- value of waiting --------------------------------------------------------
# What perfect information is worth on a 15-player rebuild, in points.
# 12.0 is about 0.8 points per player. Raise it if you think early-season form
# is mostly noise; lower it if you trust two gameweeks of data.
info_value: 22.0
break_bonus: 4.0          # extra credit for a gameweek right after an international break
# How many teams above you count as "the pack" whose ownership you are
# measured against. Raised 10 -> 20 with rivalry: from last place in a
# 42-team league the ten immediately above are not the teams that decide the
# season, and a pack that narrow makes almost everyone's picks look like a
# differential.
rival_depth: 20

# --- projections -------------------------------------------------------------
solio_url: https://fpl.solioanalytics.com/api/data/latest.json
solio_weight: 0.7         # trust Solio over the local model where both exist
# Weight on a PLAYER's recent form against his season rate.
#
# Lowered 0.30 -> 0.15 on 16 Oct 2026. FPL's `form` field is POINTS per match
# over the last 30 days, and points include over-performance, so this dial
# rewards a player for finishing above his expected goals and then projects
# the luck forward. Measured the same day with the new overdue tables:
# Semenyo's expected goals, assists, appearance and defensive numbers support
# 3.02 points a week; the model said 6.47. He has banked about 3.2 goal
# involvements above expectation on an xG90 of 0.057. The engine recommended
# selling Saka — owed 1.67 involvements on 0.85 xGI90 — to buy him. That
# recommendation was withdrawn.
#
# Not set to zero: form genuinely carries information a season total cannot,
# such as a player newly on penalties or newly starting. 0.15 keeps that and
# halves the amplification of luck.
#
# NOTE this is a dampener, not the cure. The base rate underneath is
# `total_points / 90`, which embeds over-performance whether or not this dial
# is zero. The real fix is to blend the base toward what xG and xA support.
# Do that once the ledger has enough settled gameweeks to measure whether it
# helps — see LEARNINGS.md point 4 and docs/ledger/.
form_weight: 0.15
strength_weight: 0.5      # weight on measured team attack/defence vs FPL fixture rating
# And the same idea for the TEAM. Season-long expected goals move slowly: a side
# that was poor in August and has been excellent since scores as mediocre until
# the average catches up, by which time the run is over. This folds recent
# results in on top — opponent-adjusted, so it cannot just reward an easy run,
# and time-decayed, so the last match counts most.
#
# Keep it modest. One result is a large share of the evidence this early, and
# reading a 3-0 as a new permanent truth is how a wildcard gets spent on a team
# that was having a good afternoon. 0 turns it off entirely.
team_form_weight: 0.35
team_form_half_life: 2.5  # in matches: at 2.5 the game before last counts ~3/4

# --- output ------------------------------------------------------------------
out_dir: docs
pool_size: 130         # candidate players in the solve; higher is slower
time_limit: 110        # seconds the solver may spend
hit_time_limit: 60     # shorter budget for the "is a hit worth it" re-solve
elite_sample: 100      # how many of the world's top managers to sample

# --- your squad right now ----------------------------------------------------
# The public API only shows last gameweek's team, and transfers you have already
# made for the upcoming deadline are invisible to it. If you have moved this
# week, list all fifteen here and set the bank. Comment it out to use the API.
# GW5 has kicked off, so the API now returns the squad that actually played —
# Szoboszlai out, Gibbs-White in — and the real bank with it. A hand-kept list
# can only be wrong from here, and a wildcard drafted against the wrong
# fifteen is drafted against the wrong budget. Put it back the moment you make
# a transfer for a deadline that has not passed yet.
# Pinned from the manager's own GW6 Transfers screen, 10 Oct 08:35 UTC. The API
# read (entry/3907632/event/5/picks) returned a materially different fifteen —
# only Rogers, Joao Pedro and Haaland overlap — so one of the two is not this
# team. The screen the manager is looking at wins; a wildcard drafted against
# the wrong fifteen is drafted against the wrong budget and the wrong sells.
# Worth resolving before next week: see RUNBOOK.md.
#
# Prices here are SELLING prices as the Transfers page shows them, which is what
# the budget is actually made of.
current_squad:
  # Pinned from the manager's own GW7 Transfers screen, 15 Oct 15:37 local.
  # This is the post-wildcard fifteen: the GW6 Wildcard rebuilt the squad, so
  # the API's last-finished-gameweek read is the OLD team and must not be used.
  # Prices are SELLING prices as the Transfers page shows them, which is what
  # the budget is actually made of.
  - Leno          # 4.5  GKP  HUL (H)
  - Tzolakis      # 4.7  GKP  FUL (A)
  - Silva         # 5.0  DEF  SUN (H)
  - Khalaili      # 5.0  DEF  BHA (A)
  - Thomas        # 4.0  DEF  TOT (A)
  - Davis         # 4.0  DEF  MCI (A)
  - Bogle         # 4.6  DEF  MUN (H)
  - Janelt        # 5.0  MID  LIV (H)
  - B.Fernandes   # 11.9 MID  LEE (A)
  - Saka          # 9.5  MID  NFO (A)
  - Groß          # 5.8  MID  CRY (H)
  - Schade        # 6.2  MID  LIV (H)  flagged — yellow, 75%
  - Haaland       # 15.5 FWD  IPS (H)
  - Kostoulas     # 5.6  FWD  CRY (H)
  - João Pedro    # 7.6  FWD  EVE (A)
bank: 0.6

# Which gameweek the pin above was taken for. The pin is right for exactly
# one deadline and wrong from the next, and it has already gone stale once —
# a GW7 solve drafted against a squad the manager had not owned for three
# days. `guards.check_squad_pin` refuses a plan built on a stale pin.
squad_pinned_for: 7

# One free transfer into GW7; a second move costs 4. Declared because the
# public API does not expose it.
free_transfers: 1

# --- locked chip plan --------------------------------------------------------
# Gameweeks you have committed to. The solver stops re-deciding these every week
# and plans around them instead. Remove a line to hand that chip back to it.
# One chip per gameweek — the solver enforces that, so do not double-book.
# Chips already played this half. FPL's public API does not expose this, so it
# is declared here for the same reason free_transfers is. Get it wrong and the
# report recommends a chip you do not have — which is how a GW8 Triple Captain
# worth 9.3 points got suggested for a chip that was already spent.
# Chips already played, BY HALF. FPL issues two full sets: the first expires
# at the GW19 deadline and a fresh Wildcard, Triple Captain, Bench Boost and
# Free Hit arrive for GW20. Spending one in the first half says nothing about
# the second, and the engine used to assume otherwise — from GW20 on, no chip
# had any window at all, so it would have quietly stopped planning chips for
# the rest of the season.
#
# A plain list still works and means the first half.
chips_used:
  first: [tc, wc]     # Triple Captain GW3, Wildcard GW6
  second: []          # untouched — a whole new set from GW20

chip_plan:
  # Empty on purpose. Triple Captain went in GW3 and the Wildcard in GW6, so
  # the only chips left are Bench Boost and Free Hit and neither has a
  # committed week. Let the sweep price Bench Boost across the free weeks
  # rather than pinning it here — pinning is what had the solver building
  # around a Wildcard it had already spent.
  #
  # Free Hit stays unplaced: there are no blanks before it expires at the GW19
  # deadline, so no week obviously claims it.

# --- the rebuild -------------------------------------------------------------
# A wildcard gets its own solve, because it is a different question from a
# transfer: fifteen players from nothing, and the cheap end is what funds the
# expensive end. `chip_plan.wc` above says which gameweek; these say how it is
# drafted. Run `--wildcard N` to draft one for gameweek N without committing
# the chip in `chip_plan`.
wildcard_horizon: 8        # gameweeks the rebuild is judged over
wildcard_per_cell: 14      # candidates per position and price band
wildcard_cheap_per_pos: 6  # cheapest players kept regardless of points
wildcard_min_minutes: 20   # below this he is a body, not a squad slot
wildcard_time_limit: 180   # seconds
# Names you want in or out of the rebuild whatever the model thinks. This is
# the argument, not the override — every forced pick costs points, and the
# report prints what it cost.
# wildcard_keep: [Haaland]
# wildcard_ban: []

# --- your own plan -----------------------------------------------------------
# Write what you actually intend to do, and the report checks it against the
# rules and prices it against the solver's own line. This is the bit that lets
# you argue with the model instead of only reading it.
#
# Names, not ids. Chips are wc, fh, tc, bb — and `chip_plan` above is folded in
# automatically, so you only repeat a chip here if you also want transfers that
# week. Leave it commented out and the report just grades your chip plan.
#
#   my_plan:
#     5:
#       out: [Wirtz]
#       in:  [Gibbs-White]
#     7:
#       chip: tc
#
# my_plan:

# --- European commitments ----------------------------------------------------
# The Premier League fixture API knows nothing about European football, so the
# competing clubs and the gameweeks that sit between European matchdays are
# declared here. Check the UEFA calendar and update; a wrong list is worse than
# an empty one.
european_teams: [MCI, ARS, LIV, CHE, NEW, TOT, AVL, NFO]
# Gameweeks that FOLLOW a European midweek, so the haircut lands on the
# league game the rotation actually shows up in.
#
# Corrected 16 Oct 2026 against Ben Crellin's season calendar. The old list
# [7, 8, 10, 13, 16, 18] had GW13 and GW18 as European weeks when neither
# is, and missed GW12, GW15, GW22 and GW23 — so eight clubs' minutes were
# being discounted in the wrong weeks. GW7, GW8 and GW10 were right, which
# is why nothing in the current horizon moves.
#
#   MD2  Oct 13 -> GW7      MD6  Dec  8 -> GW15
#   MD3  Oct 20 -> GW8      MD6* Dec 15 -> GW16
#   MD4  Nov  3 -> GW10     MD7  Jan 19 -> GW22
#   MD5  Nov 24 -> GW12     MD8  Jan 26 -> GW23
#
# Knockouts from February are in `blank_gws`/`double_gws` territory and are
# listed there rather than here.
european_weeks: [7, 8, 10, 12, 15, 16, 22, 23]

# --- blanks and doubles ------------------------------------------------------
# Source: Ben Crellin's season calendar, read from a screenshot on 16 Oct
# 2026. This is a FORECAST from cup progression, not a fixture list: the FPL
# API will not show a rescheduled match until it is actually rescheduled, so
# these are months ahead of anything the engine can derive. That is exactly
# why they are declared by hand — it is the one input the model cannot
# produce for itself.
#
# Nothing here falls before GW19, which independently confirms the engine's
# own finding that the first-half Free Hit has no natural home: there is no
# blank to use it on before it expires.
#
# Confidence is the calendar's own, not mine. Re-read it as cups resolve;
# a semi-final result moves these.
# Corrected against a full-resolution copy of the calendar. The first read
# was off a phone screenshot and put GW35 and GW36 in the wrong bucket:
# bright yellow is "Likely DGW" and tan is "Possible DGW", and at phone size
# they are nearly the same colour. Only GW32 is called likely.
# --- cup collisions, simulated -----------------------------------------------
# Which league gameweek each cup round displaces, and which round it is. The
# dates are published; who survives to that round is simulated from a random
# draw and team strength, so the output is a probability per club rather
# than a point call. See gaffer/cups.py and docs/CALENDAR.md.
cup_blanks:
  33: {cup: fa,  round: semi_final}    # Apr 24 — FA Cup semi-finals
  37: {cup: fa,  round: final}         # May 22 — FA Cup final
  30: {cup: efl, round: final}         # Mar 20 — EFL Cup final, see below

# A postponed league match returns in a free midweek. Which one is a
# scheduling decision rather than a model output, so the candidate weeks are
# declared and `share` is the chance the replay lands in this one.
cup_doubles:
  32: {from_blank_gw: 30, share: 0.7}
  35: {from_blank_gw: 33, share: 0.5}
  36: {from_blank_gw: 33, share: 0.5}

# The EFL Cup began before this engine did and its draw is in no feed here,
# so GW30 reports "not known" rather than two invented finalists. Fill this
# in from a published bracket to switch it on.
# cup_entrants:
#   efl: [MCI, ARS, ...]

blank_gws: [30, 33]              # red:    Mar 20, Apr 24
possible_blank_gws: [37]         # salmon: May 22
double_gws: [32]                 # yellow, "Likely DGW":   Apr 17
possible_double_gws: [35, 36]    # tan,    "Possible DGW": May 8, May 15
european_haircut: 0.12    # minutes lost in a European week
midweek_haircut: 0.06     # minutes lost in a domestic midweek round

# --- calibration -------------------------------------------------------------
calibrate_to_solio: true  # scale local projections to match Solio where they overlap
