# --- who you are -------------------------------------------------------------
entry_id: 3907632           # your FPL team id
league_id: 88825            # FPL Aarhus Liga

# --- how the gaffer thinks ---------------------------------------------------
horizon: 5                  # gameweeks to plan ahead
decay: 0.87                 # weight on each future gameweek (near-term certainty)
hit_cost: 4                 # points per extra transfer
hit_threshold: 6.0
min_transfer_gain: 1.5    # a transfer must beat this to be recommended; wildcard weeks are exempt
# How hard the learned ceiling tilts the Triple Captain armband toward a player
# who can spike, on top of his expected points. Small on purpose: it breaks ties
# between comparable captains, it does not overrule the projection. Set 0 to
# choose the armband on expected points alone.
# Set to 0 on 10 Oct 2026 because the ceiling model is not calibrated. Its AUC
# is 0.849, which is respectable — but AUC is rank-based and says nothing about
# whether the numbers are probabilities, and this consumer multiplies the
# probability directly. In the GW6 solve B.Fernandes read 0.705 against a median
# of 0.019 and a mean of 0.028, a ~25-sigma outlier, while Haaland — the single
# likeliest hauler in the game — read 0.11, below Dibling and Rice. Several of
# the highest-ceiling players were projected for ~0 points, so it is not
# conditioning on minutes either.
#
# At weight 6.0 that handed B.Fernandes about +4.2 points of armband preference
# from a broken number. Restore it to 6.0 once `ceiling` is wrapped in a
# calibrator (Platt or isotonic) and scores.json records calibration error
# alongside AUC.
ceiling_weight: 0.0
max_chips_in_horizon: 2          # only recommend a hit if it gains this much over the horizon
bench_weights: [0.16, 0.11, 0.06, 0.02]

# --- mini-league strategy ----------------------------------------------------
# 0.0 = pure expected points. 1.0 = pure differential-chasing.
# Raise it when you are behind and need variance; lower it when you are ahead.
rivalry: 0.35

# --- value of waiting --------------------------------------------------------
# What perfect information is worth on a 15-player rebuild, in points.
# 12.0 is about 0.8 points per player. Raise it if you think early-season form
# is mostly noise; lower it if you trust two gameweeks of data.
info_value: 22.0
break_bonus: 4.0          # extra credit for a gameweek right after an international break
rival_depth: 10             # how many teams above you count as "the pack"

# --- projections -------------------------------------------------------------
solio_url: https://fpl.solioanalytics.com/api/data/latest.json
solio_weight: 0.7         # trust Solio over the local model where both exist
form_weight: 0.30         # weight on a PLAYER's recent form vs his season rate
strength_weight: 0.5      # weight on measured team attack/defence vs FPL fixture rating
# And the same idea for the TEAM. Season-long expected goals move slowly: a side
# that was poor in August and has been excellent since scores as mediocre until
# the average catches up, by which time the run is over. This folds recent
# results in on top — opponent-adjusted, so it cannot just reward an easy run,
# and time-decayed, so the last match counts most.
#
# Keep it modest. One result is a large share of the evidence this early, and
# reading a 3-0 as a new permanent truth is how a wildcard gets spent on a team
# that was having a good afternoon. 0 turns it off entirely.
team_form_weight: 0.35
team_form_half_life: 2.5  # in matches: at 2.5 the game before last counts ~3/4

# --- output ------------------------------------------------------------------
out_dir: docs
pool_size: 130         # candidate players in the solve; higher is slower
time_limit: 110        # seconds the solver may spend
hit_time_limit: 60     # shorter budget for the "is a hit worth it" re-solve
elite_sample: 100      # how many of the world's top managers to sample

# --- your squad right now ----------------------------------------------------
# The public API only shows last gameweek's team, and transfers you have already
# made for the upcoming deadline are invisible to it. If you have moved this
# week, list all fifteen here and set the bank. Comment it out to use the API.
# GW5 has kicked off, so the API now returns the squad that actually played —
# Szoboszlai out, Gibbs-White in — and the real bank with it. A hand-kept list
# can only be wrong from here, and a wildcard drafted against the wrong
# fifteen is drafted against the wrong budget. Put it back the moment you make
# a transfer for a deadline that has not passed yet.
# current_squad:
#   - Lammens
#   ...
# bank: 1.4

# --- locked chip plan --------------------------------------------------------
# Gameweeks you have committed to. The solver stops re-deciding these every week
# and plans around them instead. Remove a line to hand that chip back to it.
# One chip per gameweek — the solver enforces that, so do not double-book.
# Chips already played this half. FPL's public API does not expose this, so it
# is declared here for the same reason free_transfers is. Get it wrong and the
# report recommends a chip you do not have — which is how a GW8 Triple Captain
# worth 9.3 points got suggested for a chip that was already spent.
chips_used: [tc]

chip_plan:
  # Triple Captain is SPENT — it is no longer a decision and must not be planned.
  # Leaving `tc` here had the solver building around a chip that does not exist.
  wc: 7      # Wildcard, 17 Oct. GW6 was the break week, but the fixture swing
             # lands at GW7 (Bournemouth and Spurs improve, Fulham start
             # Hull/Coventry, City host Ipswich) and GW6's team news is
             # unresolved — Joao Pedro is due back 17 Oct, Isak and Gakpo out.
  bb: 9      # Bench Boost. Held two weeks after the rebuild so the drafted
             # fifteen is known-fit before it is spent.
  # Free Hit is deliberately unset. There are no blanks before the GW19 expiry,
  # so there is no week it obviously belongs in — let the chip sweep price it.

# --- the rebuild -------------------------------------------------------------
# A wildcard gets its own solve, because it is a different question from a
# transfer: fifteen players from nothing, and the cheap end is what funds the
# expensive end. `chip_plan.wc` above says which gameweek; these say how it is
# drafted. Run `--wildcard N` to draft one for gameweek N without committing
# the chip in `chip_plan`.
wildcard_horizon: 8        # gameweeks the rebuild is judged over
wildcard_per_cell: 14      # candidates per position and price band
wildcard_cheap_per_pos: 6  # cheapest players kept regardless of points
wildcard_min_minutes: 20   # below this he is a body, not a squad slot
wildcard_time_limit: 180   # seconds
# Names you want in or out of the rebuild whatever the model thinks. This is
# the argument, not the override — every forced pick costs points, and the
# report prints what it cost.
# wildcard_keep: [Haaland]
# wildcard_ban: []

# --- your own plan -----------------------------------------------------------
# Write what you actually intend to do, and the report checks it against the
# rules and prices it against the solver's own line. This is the bit that lets
# you argue with the model instead of only reading it.
#
# Names, not ids. Chips are wc, fh, tc, bb — and `chip_plan` above is folded in
# automatically, so you only repeat a chip here if you also want transfers that
# week. Leave it commented out and the report just grades your chip plan.
#
#   my_plan:
#     5:
#       out: [Wirtz]
#       in:  [Gibbs-White]
#     7:
#       chip: tc
#
# my_plan:

# --- European commitments ----------------------------------------------------
# The Premier League fixture API knows nothing about European football, so the
# competing clubs and the gameweeks that sit between European matchdays are
# declared here. Check the UEFA calendar and update; a wrong list is worse than
# an empty one.
european_teams: [MCI, ARS, LIV, CHE, NEW, TOT, AVL, NFO]
european_weeks: [7, 8, 10, 13, 16, 18]
european_haircut: 0.12    # minutes lost in a European week
midweek_haircut: 0.06     # minutes lost in a domestic midweek round

# --- calibration -------------------------------------------------------------
calibrate_to_solio: true  # scale local projections to match Solio where they overlap
