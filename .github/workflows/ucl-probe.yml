name: ucl-probe
# Finds UEFA's UCL Fantasy endpoints from a runner that has network access,
# because the assistant's own container does not. Never on a schedule — it hits
# third-party URLs and there is no reason to do that repeatedly.
# Push-triggered too: GitHub only registers workflow_dispatch once the file is
# on the default branch, and a probe that exists to inform what we merge
# cannot wait for the merge.
on:
  workflow_dispatch:
    inputs:
      matchday:
        description: "Matchday to snapshot"
        required: false
        default: "2"
  push:
    branches: [claude/ucl-support]
    paths: ['gaffer/ucl/**', '.github/workflows/ucl-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe UEFA endpoints
        run: |
          python -m gaffer.ucl.snapshot "${MATCHDAY:-2}" | tee gaffer/ucl/snapshot.txt || true
        env:
          MATCHDAY: ${{ github.event.inputs.matchday }}
      - name: commit the findings
        # An artifact is useless to a reader without network: gh refuses the
        # redirect to blob storage and the container cannot reach it either.
        # Committing puts the answer somewhere a git pull can read it, which is
        # the same reason the solve commits its own output.
        run: |
          mv -f probe.json gaffer/ucl/probe.json 2>/dev/null || true
          git config user.name gaffer
          git config user.email gaffer@users.noreply.github.com
          # -A over a directory: `git add` on a path that does not exist is
          # fatal under `bash -e`, so a step that failed earlier took the whole
          # job down and hid its own error.
          git add -A gaffer/ucl/
          git diff --staged --quiet || git commit -m "ucl probe: $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
