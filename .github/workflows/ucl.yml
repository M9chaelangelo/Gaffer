name: ucl
# The UCL plan runs here because the assistant's own container is denied
# gaming.uefa.com by the environment's network policy. Same arrangement as
# the FPL solve: run where there is network, commit the answer, read it from
# a git pull.
on:
  schedule:
    # League-phase matchdays are Tuesday and Wednesday, with the deadline an
    # hour before the first kick-off. Monday and Tuesday mornings give a plan
    # in hand and a second look once the team news lands.
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      matchday:
        description: "Matchday to plan (blank = the one in config/ucl.yaml)"
        required: false
        default: ""
      sims:
        description: "Monte Carlo draws"
        required: false
        default: "60000"
  push:
    # GitHub only registers workflow_dispatch once a file is on the default
    # branch, and a plan that exists to inform a deadline cannot wait for a
    # merge. Paths-scoped so an unrelated commit does not fetch UEFA.
    branches: [claude/ucl-engine]
    paths: ['gaffer/ucl/**', 'config/ucl.yaml', '.github/workflows/ucl.yml']
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest tests/test_ucl.py -q
      - name: can this runner reach UEFA at all
        # Separates "our client is wrong" from "the host is unreachable".
        # Near matchday two the feed timed out repeatedly and we had no way
        # to tell which it was. Never fails the job.
        continue-on-error: true
        run: |
          set +e
          curl -sS -o /tmp/uefa.json -D /tmp/uefa.head --max-time 60 \
            -H 'User-Agent: Mozilla/5.0' \
            -H 'Referer: https://gaming.uefa.com/en/uclfantasy/' \
            -w 'http %{http_code}  dns %{time_namelookup}s  connect %{time_connect}s  ttfb %{time_starttransfer}s  total %{time_total}s  bytes %{size_download}\n' \
            "https://gaming.uefa.com/en/uclfantasy/services/api/Feed/players?gamedayId=3&language=en"
          echo "curl exit $?"
          head -c 400 /tmp/uefa.head 2>/dev/null
          head -c 300 /tmp/uefa.json 2>/dev/null
          echo

      - name: plan the matchday
        env:
          MD: ${{ github.event.inputs.matchday }}
          SIMS: ${{ github.event.inputs.sims }}
        run: |
          # The matchday lives in config so a scheduled run needs no input;
          # a dispatch may override it.
          if [ -z "$MD" ]; then
            MD=$(python -c "import yaml;print(yaml.safe_load(open('config/ucl.yaml'))['matchday'])")
          fi
          python -m gaffer.ucl.main --matchday "$MD" --sims "${SIMS:-60000}"
      - name: publish
        run: |
          git config user.name gaffer
          git config user.email gaffer@users.noreply.github.com
          # -A over the directories: `git add` on a path that does not exist
          # is fatal under `bash -e`, and a step that failed earlier would
          # then take the whole job down and hide its own error.
          git add -A docs gaffer/ucl
          git diff --staged --quiet || git commit -m "ucl: matchday plan $(date -u +%F)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
